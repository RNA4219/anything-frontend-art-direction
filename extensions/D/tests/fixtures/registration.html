<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>陶芸工房 参加登録</title>
<style>
:root{font-family:Arial,"Noto Sans CJK JP",sans-serif;color:#212528;background:#f5f2ea;line-height:1.6}*{box-sizing:border-box}body{max-width:760px;margin:0 auto;padding:28px 24px}header{border-top:9px solid #a34918;padding-top:20px;margin-bottom:28px}h1{font-family:Georgia,serif;font-size:32px;margin:8px 0}small{letter-spacing:.12em}fieldset{border:0;padding:0;margin:0}label{display:block;margin:14px 0 4px}input{font:inherit;padding:10px;width:100%;max-width:420px;border:1px solid #596167;background:white}input[type=checkbox]{width:auto}button{font:inherit;padding:10px 18px;border:1px solid #212528;background:#212528;color:white;cursor:pointer;margin-top:20px}button:disabled{opacity:.6}button:focus-visible,input:focus-visible{outline:3px solid #a34918;outline-offset:3px}.setup{border-top:1px solid #596167;margin-top:32px;font-size:14px}.setup label{display:flex;gap:10px;align-items:center}.message{min-height:3em;padding:8px 0}.meta{font-variant-numeric:tabular-nums}
</style>
<body><header><small>STUDIO 07 / WORKSHOP</small><h1>陶芸工房への参加登録</h1><p>11月28日（土）14:00。1組1〜8名。登録後に受付番号を表示します。</p></header>
<main><form id="registration"><fieldset><legend>参加者の情報</legend><label for="name">代表者名</label><input id="name" name="name" required autocomplete="name"><label for="email">メールアドレス</label><input id="email" name="email" type="email" required autocomplete="email"><label for="seats">参加人数（1〜8名）</label><input id="seats" name="seats" type="number" min="1" max="8" value="1" required><button id="submit" type="submit">参加を登録する</button></fieldset></form><div id="status" class="message" role="status" aria-live="polite">必要事項を入力してください。</div><p class="meta">受付済み件数：<output id="count">0</output></p>
<section class="setup" aria-label="動作確認用の設定"><h2>動作確認用</h2><label><input type="checkbox" id="fail">次の通信を失敗させる</label><p>これは架空の予約画面です。送信は端末内の模擬処理だけで完了します。</p></section></main>
<script>
const form=document.querySelector('#registration'),statusEl=document.querySelector('#status');let accepted=0;
form.addEventListener('submit',async event=>{event.preventDefault();const payload=Object.fromEntries(new FormData(form));const failure=document.querySelector('#fail').checked;statusEl.textContent='登録しています…';await new Promise(resolve=>setTimeout(resolve,350));if(failure){form.reset();document.querySelector('#fail').checked=false;statusEl.textContent='送信に失敗しました。';return;}accepted++;document.querySelector('#count').textContent=String(accepted);statusEl.textContent=payload.name+'様、'+payload.seats+'名の参加を受け付けました。受付番号：C-'+String(accepted).padStart(3,'0');});
</script></body></html>
