<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工房 依頼一覧</title>
<style>
:root{font-family:Arial,"Noto Sans CJK JP",sans-serif;color:#212528;background:#f5f2ea;line-height:1.6}*{box-sizing:border-box}body{max-width:1000px;margin:0 auto;padding:28px 24px}header{border-top:9px solid #a34918;padding-top:20px;position:relative}h1{font-family:Georgia,serif;font-size:34px;margin:8px 0}small{letter-spacing:.12em}button,input,select{font:inherit;padding:9px;border:1px solid #596167}button{background:#212528;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}:focus-visible{outline:3px solid #a34918;outline-offset:3px}.header-action{position:absolute;right:0;top:55px}.filters{display:flex;gap:18px;flex-wrap:wrap;margin:24px 0}.filters label{display:grid;gap:4px}input{max-width:100%;width:230px}table{border-collapse:collapse;width:100%;table-layout:fixed}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid #8d9294;overflow-wrap:anywhere}th:first-child{width:22%}td:last-child,th:last-child{width:26%}.pager{display:flex;align-items:center;gap:16px;margin:20px 0}.tools{margin-top:28px;border-top:1px solid #596167;font-size:14px}#summary{font-variant-numeric:tabular-nums}
</style>
<body><header><small>STUDIO 07 / REQUESTS</small><h1>依頼の確認と管理</h1><button class="header-action" id="export">一覧を書き出す</button><p>依頼の状態を絞り込み、対象を確認できます。</p></header><main><div class="filters"><label for="query">依頼名で検索<input id="query" type="search"></label><label for="filter">状態<select id="filter"><option value="all">すべて</option><option value="待ち">処理待ち</option><option value="完了">完了</option></select></label><button id="clear">条件をクリア</button></div><p id="summary" role="status"></p><table><caption>工房への依頼</caption><thead><tr><th scope="col">受付番号</th><th scope="col">依頼名</th><th scope="col">状態</th></tr></thead><tbody id="rows"></tbody></table><nav class="pager" aria-label="一覧のページ"><button id="prev">前へ</button><span id="page"></span><button id="next">次へ</button></nav><p id="notice" role="status"></p><section class="tools"><h2>動作確認用</h2><p>架空の固定データ8件を使用します。書き出しボタンは件数だけを表示します。</p></section></main>
<script>
const data=[{id:'R-101',name:'湯のみ制作',state:'待ち'},{id:'R-102',name:'大皿の修理',state:'完了'},{id:'R-103',name:'花器の制作',state:'完了'},{id:'R-104',name:'夫婦茶碗',state:'待ち'},{id:'R-105',name:'急須の釉薬確認',state:'完了'},{id:'R-106',name:'小皿セット',state:'完了'},{id:'R-107',name:'茶器の試作品',state:'完了'},{id:'R-108',name:'展示用の器',state:'完了'}];let pageIndex=0;const pageSize=3;
function filtered(){const query=document.querySelector('#query').value;const filter=document.querySelector('#filter').value;return data.filter(item=>(filter==='all'||item.state===filter)&&item.name.includes(query));}
function render(){const items=filtered();document.querySelector('#rows').replaceChildren(...items.slice(pageIndex*pageSize,(pageIndex+1)*pageSize).map(item=>{const row=document.createElement('tr');for(const value of [item.id,item.name,item.state==='待ち'?'処理待ち':item.state]){const cell=document.createElement('td');cell.textContent=value;row.append(cell);}return row;}));document.querySelector('#summary').textContent=items.length+'件の依頼';document.querySelector('#page').textContent=(pageIndex+1)+' / '+Math.max(1,Math.ceil(items.length/pageSize));document.querySelector('#prev').disabled=pageIndex===0;document.querySelector('#next').disabled=(pageIndex+1)*pageSize>=items.length;}
document.querySelector('#filter').addEventListener('change',render);document.querySelector('#query').addEventListener('input',render);document.querySelector('#clear').addEventListener('click',()=>{document.querySelector('#query').value='';document.querySelector('#filter').value='all';pageIndex=0;render();});document.querySelector('#prev').addEventListener('click',()=>{pageIndex--;render();});document.querySelector('#next').addEventListener('click',()=>{pageIndex++;render();});document.querySelector('#export').addEventListener('click',()=>{document.querySelector('#notice').textContent=filtered().length+'件を確認しました。';});render();
</script></body></html>
